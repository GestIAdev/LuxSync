<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>👻 LuxSync Phantom Audio Analyzer</title>
  <style>
    /* This window is invisible, but let's make it look nice for debugging */
    body {
      background: #0a0a0a;
      color: #00ff88;
      font-family: 'Consolas', monospace;
      padding: 20px;
    }
    h1 { color: #ff00ff; }
    .status { color: #00ffff; }
    .log { 
      background: #111; 
      padding: 10px; 
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>👻 PHANTOM WORKER</h1>
  <p class="status">Status: <span id="status">Initializing...</span></p>
  <div class="log" id="log"></div>
  
  <script>
    /**
     * ═══════════════════════════════════════════════════════════════════════════
     * 👻 PHANTOM ANALYZER - WAVE 2005.3: THE PHANTOM WORKER
     * 🩻 WAVE 2077: THE TRANSPLANT — Real GodEarFFT Integration
     * 👻 WAVE 7564.9: THE PHANTOM PURGE — Inline analysis logic DELETED.
     *   The phantom now delegates to runAnalysisPipeline() from the compiled
     *   CJS bundle (phantomPipeline.js), which contains the TempoOracle,
     *   43Hz decoupled rate, Ellis DP tracker, and variable-tempo support.
     *   This is the SAME function godear-offline.worker.ts uses — single
     *   source of truth. ~500 lines of duplicated inline JS eliminated.
     *
     * Este script corre en una BrowserWindow OCULTA.
     * Procesa audio sin afectar la UI principal.
     *
     * @version WAVE 7564.9
     */
    
    const { ipcRenderer } = require('electron')
    
    // ═══════════════════════════════════════════════════════════════════════════
    // 👻 WAVE 7564.9: Load the PHANTOM PIPELINE bundle (single source of truth)
    // This CJS bundle contains runAnalysisPipeline + TempoOracle + GodEarFFT +
    // Ellis DP tracker — everything analysisPipeline.ts exports, compiled by
    // Vite into one self-contained module. The phantom no longer has any
    // inline analysis logic.
    // ═══════════════════════════════════════════════════════════════════════════
    
    let runAnalysisPipeline = null
    let PIPELINE_CONFIG = null
    try {
      const path = require('path')
      console.log(`🔍 [Phantom] Buscando phantomPipeline desde: ${__dirname}`)
      
      const possiblePaths = [
        path.join(__dirname, '..', 'phantomPipeline.js'),         // dist-electron/phantomPipeline.js
        path.join(__dirname, 'phantomPipeline.js'),               // mismo directorio
        path.join(__dirname, '..', 'workers', 'phantomPipeline.js'),
        path.join(__dirname, '..', 'dist-electron', 'phantomPipeline.js'),
        path.join(__dirname, '..', '..', 'dist-electron', 'phantomPipeline.js'),
      ]
      
      for (const p of possiblePaths) {
        try {
          const fs = require('fs')
          if (fs.existsSync(p)) {
            const mod = require(p)
            runAnalysisPipeline = mod.runAnalysisPipeline
            PIPELINE_CONFIG = mod.DEFAULT_CONFIG
            console.log(`👻 [Phantom] ¡phantomPipeline ENCONTRADO y cargado desde!: ${p}`)
            console.log(`🔬 [Phantom] runAnalysisPipeline:`, typeof runAnalysisPipeline)
            break
          } else {
            console.log(`❌ [Phantom] No existe en: ${p}`)
          }
        } catch (e) {
          console.log(`⚠️ [Phantom] Error intentando requerir ${p}: ${e.message}`)
        }
      }
      
      if (!runAnalysisPipeline) {
        console.error('[Phantom] ❌ CRITICAL: phantomPipeline not found! Analysis will fail.')
      }
    } catch (e) {
      console.error('[Phantom] ❌ Cannot load phantomPipeline:', e.message)
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // LOGGING
    // ═══════════════════════════════════════════════════════════════════════════
    
    const statusEl = document.getElementById('status')
    const logEl = document.getElementById('log')
    
    function log(msg) {
      console.log('[PhantomAnalyzer]', msg)
      const line = document.createElement('div')
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`
      logEl.appendChild(line)
      logEl.scrollTop = logEl.scrollHeight
    }
    
    function setStatus(status) {
      statusEl.textContent = status
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // 👻 WAVE 7564.9: PHANTOM ANALYSIS — Delegated to analysisPipeline.ts
    // The inline analysis functions (extractWaveform, extractEnergyHeatmap,
    // detectBeats, estimateBpm, detectSections, detectTransients) have been
    // PURGED. The phantom now calls runAnalysisPipeline() from the compiled
    // CJS bundle — the SAME function godear-offline.worker.ts uses.
    // ═══════════════════════════════════════════════════════════════════════════

    /**
     * Get mono samples from AudioBuffer.
     * This is the ONLY function that stays inline — it needs the AudioBuffer
     * from AudioContext.decodeAudioData, which is a browser API only available
     * in the BrowserWindow context. Everything else runs in the pipeline.
     */
    function getMonoSamples(buffer) {
      const numChannels = buffer.numberOfChannels
      const length = buffer.length
      const mono = new Float32Array(length)

      // Get first channel
      buffer.copyFromChannel(mono, 0)

      // If stereo+, average channels
      if (numChannels > 1) {
        const temp = new Float32Array(length)
        for (let ch = 1; ch < numChannels; ch++) {
          buffer.copyFromChannel(temp, ch)
          for (let i = 0; i < length; i++) {
            mono[i] += temp[i]
          }
        }
        for (let i = 0; i < length; i++) {
          mono[i] /= numChannels
        }
      }

      return mono
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // 👻 WAVE 7564.9: ALL INLINE ANALYSIS FUNCTIONS PURGED
    //
    // The following functions have been DELETED (replaced by runAnalysisPipeline
    // from the compiled CJS bundle):
    //   - extractWaveform()           → now inside runAnalysisPipeline (Phase 1)
    //   - extractEnergyHeatmap()      → now inside runAnalysisPipeline (Phase 2,
    //                                    with TempoOracle + 43Hz decoupled rate)
    //   - detectBeats()               → now inside runAnalysisPipeline (Phase 3,
    //                                    with Ellis DP tracker + variable tempo)
    //   - estimateBpm()               → DEPRECATED, only used as fallback inside
    //                                    detectBeats() in analysisPipeline.ts
    //   - detectSections()            → now inside runAnalysisPipeline (Phase 4)
    //   - detectTransients()          → now inside runAnalysisPipeline (Phase 5,
    //                                    collected during FFT loop, not separate pass)
    //
    // The phantom worker is now a thin shell:
    //   1. Receive ArrayBuffer via IPC
    //   2. Decode with AudioContext.decodeAudioData (browser API, needs BrowserWindow)
    //   3. Extract mono Float32Array
    //   4. Call runAnalysisPipeline() — the SAME function godear-offline.worker.ts uses
    //   5. Return the AnalysisPipelineResult via IPC
    // ═══════════════════════════════════════════════════════════════════════════

    /**
     * Main analysis function — delegates to runAnalysisPipeline from the CJS bundle.
     * The only logic that stays here is AudioBuffer → mono Float32Array extraction,
     * because AudioContext is a browser API only available in the BrowserWindow.
     */
    async function analyzeAudioBuffer(buffer, sampleRate, reportProgress) {
      if (!runAnalysisPipeline) {
        throw new Error('[Phantom] phantomPipeline bundle not loaded — cannot analyze. Check dist-electron/phantomPipeline.js exists.')
      }

      const duration = buffer.duration
      const config = PIPELINE_CONFIG || {}

      // Get mono samples — the only browser-API-dependent step
      const monoSamples = getMonoSamples(buffer)

      // Yield to event loop before the heavy synchronous pipeline call
      await new Promise(r => setTimeout(r, 0))

      log(`🔮 [Phantom] Calling runAnalysisPipeline (${monoSamples.length} samples, ${sampleRate} Hz, ${duration.toFixed(2)}s)...`)

      // 🌊 WAVE 7564.9: THE SINGLE SOURCE OF TRUTH CALL
      // This runs the full 5-phase pipeline:
      //   Phase 1: Waveform extraction
      //   Phase 2: Energy heatmap + TempoOracle (43Hz decoupled rate, WAVE 7564.6)
      //   Phase 3: Beat detection (Ellis DP tracker + variable tempo, WAVE 7563)
      //   Phase 4: Section detection
      //   Phase 5: Transient collection (already done during Phase 2 FFT loop)
      //
      // The TempoOracle's NSDF autocorrelation + harmonic ladder + parabolic
      // interpolation now runs in the phantom worker. The 150 BPM aliasing bug
      // is fixed here — at 43 Hz, neither 126 BPM nor 150 BPM falls on an
      // integer lag.
      const result = runAnalysisPipeline(
        monoSamples,
        sampleRate,
        duration,
        config,
        (phase, progress, message) => {
          reportProgress(phase, progress)
          if (message) log(`📊 ${phase}: ${progress}% — ${message}`)
        },
      )

      // 🐀 WAVE 7564.7: THE PHANTOM CHIVATO — log the final scalar BPM.
      // This is the number that propagates to LuxAnalysisV3.detectedBpm and
      // the TransportBar. Expected after 43Hz fix: 126.xx for the techno track.
      const finalBpm = result.beatGrid?.bpm ?? 0
      const finalConf = result.beatGrid?.confidence ?? 0
      log(`🔮 [Phantom] FINAL OFFLINE BPM: ${finalBpm.toFixed(2)} (conf: ${finalConf.toFixed(2)}, variable: ${result.beatGrid?.variableTempo ?? false})`)

      reportProgress('complete', 100)

      return result
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // IPC HANDLERS
    // ═══════════════════════════════════════════════════════════════════════════
    
    ipcRenderer.on('phantom:analyze', async (event, data) => {
      const { requestId, fileName, buffer } = data
      
      log(`📂 Received analysis request: ${fileName}`)
      setStatus(`Analyzing: ${fileName}`)
      
      const startTime = Date.now()
      
      // Progress reporter
      const reportProgress = (phase, progress) => {
        ipcRenderer.send('phantom:analysis-progress', {
          requestId,
          phase,
          progress,
          message: `${phase}: ${progress}%`,
        })
      }
      
      try {
        reportProgress('loading', 0)
        
        // Create AudioContext
        const audioContext = new AudioContext()
        log(`🎵 AudioContext created (sample rate: ${audioContext.sampleRate}Hz)`)
        
        reportProgress('decoding', 0)
        
        // Decode audio (NATIVE Chromium - this is the magic! 🎩)
        log(`🔓 Decoding ${(buffer.byteLength / 1024 / 1024).toFixed(2)}MB...`)
        const audioBuffer = await audioContext.decodeAudioData(buffer)
        
        log(`✅ Decoded: ${audioBuffer.duration.toFixed(2)}s, ${audioBuffer.numberOfChannels}ch, ${audioBuffer.sampleRate}Hz`)
        reportProgress('decoding', 100)
        
        // Analyze
        log(`🧠 Running GodEar analysis...`)
        const analysisData = await analyzeAudioBuffer(audioBuffer, audioBuffer.sampleRate, reportProgress)
        
        // Cleanup
        await audioContext.close()
        log(`🧹 AudioContext closed`)
        
        const elapsed = Date.now() - startTime
        log(`✅ Analysis complete in ${elapsed}ms`)
        setStatus('Ready')
        
        // Send result back
        ipcRenderer.send('phantom:analysis-complete', {
          requestId,
          success: true,
          data: analysisData,
          durationMs: elapsed,
        })
        
      } catch (err) {
        log(`❌ Error: ${err.message}`)
        setStatus(`Error: ${err.message}`)
        
        ipcRenderer.send('phantom:analysis-error', {
          requestId,
          success: false,
          error: err.message || 'Unknown error',
        })
      }
    })
    
    // ═══════════════════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ═══════════════════════════════════════════════════════════════════════════
    
    log('👻 Phantom Analyzer initialized')
    setStatus('Ready')
    ipcRenderer.send('phantom:ready')
  </script>
</body>
</html>
